<svg xmlns="http://www.w3.org/2000/svg" width="830" height="200" viewBox="0 0 830 200" role="img" aria-label="Welcome to my profile">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d33c4"/>
      <stop offset="48%" stop-color="#6d3fe0"/>
      <stop offset="100%" stop-color="#a348d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.55">
      <stop offset="0" stop-color="#2a1a8f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2a1a8f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="830" height="200" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="830" height="200" fill="url(#g1)"/>
    <rect width="830" height="200" fill="url(#grid)"/>
    <rect width="830" height="200" fill="url(#glow)"/>
    <rect width="830" height="200" fill="url(#glow2)"/>

    <!-- 一道闭环波形，压在下三分之一 -->
    <path d="M0 150 C46 150 46 122 92 122 S138 178 184 178 S230 130 276 130 S322 168 368 168 S414 150 460 150 S506 118 552 118 S598 176 644 176 S690 128 736 128 S782 150 830 150"
          fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.22"/>
    <path d="M0 150 C46 150 46 122 92 122 S138 178 184 178 S230 130 276 130 S322 168 368 168 S414 150 460 150 S506 118 552 118 S598 176 644 176 S690 128 736 128 S782 150 830 150"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="70 760" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="830" to="0" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- 细线刻度 -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.18">
      <line x1="728" y1="46" x2="782" y2="46"/>
      <line x1="740" y1="58" x2="782" y2="58"/>
      <line x1="752" y1="70" x2="782" y2="70"/>
    </g>
  </g>

  <text x="52" y="92" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="41" font-weight="700" letter-spacing="-0.4" fill="#1a1060" opacity="0.25">Welcome to my profile</text>
  <text x="50" y="90" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="41" font-weight="700" letter-spacing="-0.4" fill="#ffffff">Welcome to my profile</text>

  <text x="52" y="124" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="11.5" letter-spacing="3.2" fill="#ffffff" opacity="0.72">EMBEDDED · REALTIME · MOTION CONTROL</text>
</svg>
