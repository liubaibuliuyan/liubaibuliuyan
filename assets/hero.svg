<svg xmlns="http://www.w3.org/2000/svg" width="830" height="230" viewBox="0 0 830 230" role="img" aria-label="留白">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="55%" stop-color="#0a1436"/>
      <stop offset="100%" stop-color="#0d1f5c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.82" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#bfdbfe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.028"/>
    </pattern>
    <clipPath id="card"><rect width="830" height="230" rx="14"/></clipPath>
    <clipPath id="nameClip">
      <text x="52" y="112" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
            font-size="52" font-weight="700" letter-spacing="8">留白</text>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="830" height="230" fill="url(#bg)"/>
    <rect width="830" height="230" fill="url(#halo)"/>
    <rect width="830" height="230" fill="url(#grid)"/>

    <!-- 底层：一条安静的轨迹 -->
    <path d="M-40 182 C40 182 40 150 120 150 S200 206 280 206 S360 158 440 158 S520 200 600 200 S700 166 780 166 S860 182 900 182"
          fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.20"/>

    <!-- 上面：两段流动的高亮，速度错开 -->
    <g fill="none" stroke-linecap="round">
      <path d="M-40 182 C40 182 40 150 120 150 S200 206 280 206 S360 158 440 158 S520 200 600 200 S700 166 780 166 S860 182 900 182"
            stroke="url(#lineA)" stroke-width="2" stroke-dasharray="220 1000">
        <animate attributeName="stroke-dashoffset" from="1220" to="0" dur="6.5s" repeatCount="indefinite"/>
      </path>
      <path d="M-40 182 C40 182 40 150 120 150 S200 206 280 206 S360 158 440 158 S520 200 600 200 S700 166 780 166 S860 182 900 182"
            stroke="url(#lineB)" stroke-width="1.4" stroke-dasharray="90 1200" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="1290" to="0" dur="10.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 名字 + 扫光 -->
    <text x="52" y="112" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
          font-size="52" font-weight="700" letter-spacing="8" fill="url(#name)">留白</text>
    <g clip-path="url(#nameClip)">
      <rect x="-240" y="40" width="240" height="110" fill="url(#shine)" opacity="0.85">
        <animate attributeName="x" from="-240" to="880" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="54" y="150" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="11" letter-spacing="4.4" fill="#7c8bb5">LIUBAI</text>

    <!-- 状态灯 -->
    <circle cx="750" cy="52" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="52" r="4" fill="none" stroke="#38bdf8" stroke-width="1">
      <animate attributeName="r" values="4;10;4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="762" y="56" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#7c8bb5">ONLINE</text>
    <text x="782" y="86" text-anchor="end" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#3f4a6b">0x01</text>
  </g>
</svg>
