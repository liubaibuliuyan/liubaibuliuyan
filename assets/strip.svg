<svg xmlns="http://www.w3.org/2000/svg" width="830" height="170" viewBox="0 0 830 170" role="img" aria-label="">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="48%" stop-color="#1a1145"/>
      <stop offset="100%" stop-color="#331356"/>
    </linearGradient>
    <radialGradient id="sglowA" cx="0.2" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sglowB" cx="0.85" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="topA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b8ff"/><stop offset="100%" stop-color="#6f83ea"/>
    </linearGradient>
    <linearGradient id="leftA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5bc4"/><stop offset="100%" stop-color="#2b357f"/>
    </linearGradient>
    <linearGradient id="rightA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33409a"/><stop offset="100%" stop-color="#1c2459"/>
    </linearGradient>

    <linearGradient id="topB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc6e4"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="leftB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d75aa7"/><stop offset="100%" stop-color="#8e2f75"/>
    </linearGradient>
    <linearGradient id="rightB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8438c"/><stop offset="100%" stop-color="#6b2260"/>
    </linearGradient>

    <radialGradient id="sphere" cx="0.34" cy="0.28" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#cfd9ff"/>
      <stop offset="62%" stop-color="#7c8cf8"/>
      <stop offset="100%" stop-color="#3a2f8f"/>
    </radialGradient>

    <filter id="ssoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="scard"><rect width="830" height="170" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#scard)">
    <rect width="830" height="170" fill="url(#sbg)"/>
    <rect width="830" height="170" fill="url(#sglowA)"/>
    <rect width="830" height="170" fill="url(#sglowB)"/>

    <!-- 蓝色立方体 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 -8; 0 6" dur="7s" repeatCount="indefinite"/>
      <ellipse cx="150" cy="140" rx="52" ry="10" fill="#3b82f6" opacity="0.28" filter="url(#ssoft)"/>
      <polygon points="150,44 194,66 150,88 106,66" fill="url(#topA)"/>
      <polygon points="106,66 150,88 150,136 106,114" fill="url(#leftA)"/>
      <polygon points="194,66 150,88 150,136 194,114" fill="url(#rightA)"/>
    </g>

    <!-- 中间球体 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -7; 0 7; 0 -7" dur="5.5s" repeatCount="indefinite"/>
      <ellipse cx="380" cy="142" rx="44" ry="9" fill="#a855f7" opacity="0.30" filter="url(#ssoft)"/>
      <circle cx="380" cy="88" r="44" fill="url(#sphere)"/>
      <ellipse cx="364" cy="70" rx="13" ry="9" fill="#ffffff" opacity="0.55" transform="rotate(-24 364 70)"/>
      <circle cx="380" cy="88" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    </g>

    <!-- 粉色立方体（小） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 5; 0 -6; 0 5" dur="6.2s" repeatCount="indefinite"/>
      <ellipse cx="600" cy="134" rx="40" ry="8" fill="#f472b6" opacity="0.30" filter="url(#ssoft)"/>
      <polygon points="600,58 634,75 600,92 566,75" fill="url(#topB)"/>
      <polygon points="566,75 600,92 600,130 566,113" fill="url(#leftB)"/>
      <polygon points="634,75 600,92 600,130 634,113" fill="url(#rightB)"/>
    </g>

    <!-- 金字塔 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -5; 0 5; 0 -5" dur="6.8s" repeatCount="indefinite"/>
      <ellipse cx="722" cy="136" rx="34" ry="7" fill="#7c8cf8" opacity="0.24" filter="url(#ssoft)"/>
      <polygon points="722,52 758,128 722,116" fill="#6f83ea"/>
      <polygon points="722,52 686,128 722,116" fill="#4b5bc4"/>
      <polygon points="686,128 722,116 758,128 722,140" fill="#2b357f" opacity="0.9"/>
    </g>
  </g>
</svg>
